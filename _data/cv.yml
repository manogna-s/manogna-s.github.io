    - title: Senior Software Engineer
      institution: PathPartner Technology, Bangalore
      year: Jan 2020 - Sep 2020
      description:
        - DSP Optimization for ML Workloads - Implemented SIMD-vectorized kernels using intrinsics to accelerate TensorFlow operations on Cadence Tensilica Vision DSPs, improving execution efficiency on resource-constrained edge devices.
    - title: Software Engineer
      institution: PathPartner Technology, Bangalore
      year: Jul 2017 - Dec 2019
      description:
        - Face Detector for Driver Monitoring System - Built and deployed a Single-Shot Detector-based face detection system for driver monitoring SDK, integrated across Intel, ARM, Qualcomm, and Cadence platforms for real-time inference.
        - Edge Deployment of Deep Learning Models - Ported and optimized TensorFlow/Caffe models to edge devices using SNPE, OpenVINO, and ArmNN, enabling efficient on-device inference.
        - MLPerf-style Benchmarking - Benchmarked representative CNN architectures (e.g., ResNet, Inception) on NVIDIA Jetson TX2 and Nano, analyzing latency, throughput, and energy trade-offs to inform deployment decisions on edge hardware.
        - Industrial Defect Detection - Developed a CNN-based visual inspection system for detecting defective vacuum-sealed food packages for real-time deployment in industrial production pipelines.

